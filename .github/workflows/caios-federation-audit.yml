name: CAIOS Federated System Audit

concurrency:
  group: caios-federation-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

jobs:
  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: aethel-grid
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/safety-kernel
          ref: main
          path: aethel-grid/federated/safety-kernel
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/project-mono
          ref: main
          path: aethel-grid/federated/project-mono
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/openclaw-governance
          ref: main
          path: aethel-grid/federated/openclaw-governance
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/undermoon
          ref: main
          path: aethel-grid/federated/undermoon
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/alpha-intelligence-hub
          ref: main
          path: aethel-grid/federated/alpha-intelligence-hub
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/World-Tribe-Protocol
          ref: main
          path: aethel-grid/federated/World-Tribe-Protocol
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/openclaw-colony
          ref: main
          path: aethel-grid/federated/openclaw-colony
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/sports-math-agent-orchestration
          ref: main
          path: aethel-grid/federated/sports-math-agent-orchestration
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/calcula-colony
          ref: main
          path: aethel-grid/federated/calcula-colony
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/crew-colony
          ref: main
          path: aethel-grid/federated/crew-colony
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/clawhub
          ref: main
          path: aethel-grid/federated/clawhub
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: iAAi33iAAi/ALEXARAC
          ref: main
          path: aethel-grid/federated/ALEXARAC
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test runner and crypto adapter
        run: python -m pip install "pytest>=8,<9" "cryptography==50.0.2"

      - name: Test federation bridge
        working-directory: aethel-grid
        run: python -m pytest -q federation/test_caios_federation.py

      - name: Generate federated snapshot
        working-directory: aethel-grid
        run: python federation/caios_federation.py --verify --output ops/caios/federation-snapshot.json

      - name: Run portfolio CI parity audit
        working-directory: aethel-grid
        run: python federation/portfolio_ci_parity.py --manifest federation/system_manifest.json --root . --output ops/caios/portfolio-ci-parity.json --timeout-seconds 600

      - name: Upload federated evidence
        uses: actions/upload-artifact@v4
        with:
          name: caios-portfolio-federation-evidence
          path: |
            aethel-grid/ops/caios/federation-snapshot.json
            aethel-grid/ops/caios/portfolio-ci-parity.json
