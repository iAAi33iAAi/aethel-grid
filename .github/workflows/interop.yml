name: AETHEL Grid Interop

on:
  push:
    branches: [main, aethel/interop-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pytest>=8,<9"
      - run: python -m pytest -q interop
